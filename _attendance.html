<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign Presences - AXcent Dance</title>
    <meta name="description" content="AXcent Dance attendance marking.">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://jwravnvytkmsvqoqkmwb.supabase.co; object-src 'none'; base-uri 'self';">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..900&family=Outfit:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
    <link rel="stylesheet" href="style.css?v=4.2">
    <link rel="stylesheet" href="tropic-noir.css?v=5.2">
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
    <link rel="icon" href="/favicon-axcent-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/favicon-axcent-transparent.svg" type="image/svg+xml">
    <style>
        .att-container {
            max-width: 560px;
            margin: 0 auto;
            padding: 16px 14px 60px;
        }

        .att-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin: 1.4rem 0 1.2rem;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .att-eyebrow {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--accent-gold);
            margin: 0 0 0.3rem;
        }

        .att-header h1 {
            font-family: var(--font-heading, 'Playfair Display', serif);
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 600;
            color: var(--title-cream);
            margin: 0;
        }

        .att-link {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-muted);
            border: 1px solid rgba(157, 180, 171, 0.28);
            border-radius: 10px;
            padding: 8px 14px;
            text-decoration: none;
        }

        .att-link:hover {
            color: var(--text-main);
            border-color: var(--accent-gold);
        }

        .att-card {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 18px 16px;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-soft);
        }

        .week-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .week-bar__label {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--title-cream);
            text-align: center;
            flex: 1;
        }

        .week-bar button {
            background: transparent;
            border: 1px solid rgba(157, 180, 171, 0.28);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1.1rem;
            line-height: 1;
            padding: 8px 14px;
            cursor: pointer;
        }

        .week-bar button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .chip-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .chip {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid rgba(157, 180, 171, 0.28);
            border-radius: 999px;
            padding: 8px 14px;
            cursor: pointer;
        }

        .chip--active {
            color: #10231F;
            background: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .att-summary {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 4px 0 10px;
        }

        .att-summary strong {
            color: var(--title-cream);
        }

        .btn-all {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(81, 207, 102, 0.4);
            background: rgba(81, 207, 102, 0.1);
            color: #8FD9A0;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .att-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            background: #10322B;
            border: 1px solid rgba(157, 180, 171, 0.2);
            border-radius: 14px;
            padding: 14px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 1rem;
        }

        .att-row__name {
            font-weight: 600;
            flex: 1;
        }

        .att-row__role {
            font-family: 'Outfit', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border: 1px solid rgba(157, 180, 171, 0.3);
            border-radius: 6px;
            padding: 2px 7px;
        }

        .att-row__flex {
            font-family: 'Outfit', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent-gold);
            white-space: nowrap;
        }

        .att-row__state {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 0.78rem;
            min-width: 74px;
            text-align: center;
            border-radius: 8px;
            padding: 6px 0;
            border: 1px solid rgba(157, 180, 171, 0.3);
            color: var(--text-muted);
        }

        .att-row--present {
            border-color: rgba(81, 207, 102, 0.5);
        }

        .att-row--present .att-row__state {
            background: rgba(81, 207, 102, 0.15);
            border-color: rgba(81, 207, 102, 0.5);
            color: #8FD9A0;
        }

        .att-row--absent {
            border-color: rgba(255, 107, 107, 0.45);
            opacity: 0.75;
        }

        .att-row--absent .att-row__state {
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.45);
            color: #FFB4A6;
        }

        .att-row--dropin {
            border-style: dashed;
        }

        .dropin-input {
            width: 100%;
            padding: 12px 14px;
            background: #10322B;
            border: 1px solid rgba(157, 180, 171, 0.28);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .dropin-result {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px dashed rgba(157, 180, 171, 0.3);
            border-radius: 12px;
            padding: 11px 14px;
            margin-bottom: 6px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .dropin-result:hover {
            border-color: var(--accent-gold);
        }

        .muted-note {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .muted-note a {
            color: var(--accent-gold);
        }

        h2.att-section {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            margin: 0 0 0.8rem;
        }
    </style>
</head>

<body class="tropic">
    <div class="att-container">
        <div class="att-header">
            <div>
                <p class="att-eyebrow">AXcent Dance</p>
                <h1>Sign Presences</h1>
            </div>
            <a class="att-link" href="_admin">Dashboard</a>
        </div>

        <div class="att-card" id="gateCard">
            <p class="muted-note" id="gateMessage">Checking access...</p>
        </div>

        <div class="att-card" id="pickCard" style="display: none;">
            <div class="week-bar">
                <button type="button" id="prevWeek" aria-label="Previous week">&larr;</button>
                <span class="week-bar__label" id="weekLabel"></span>
                <button type="button" id="nextWeek" aria-label="Next week">&rarr;</button>
            </div>
            <div class="chip-row" id="dayChips"></div>
            <div class="chip-row" id="classChips"></div>
        </div>

        <div class="att-card" id="markCard" style="display: none;">
            <h2 class="att-section" id="markTitle"></h2>
            <p class="att-summary" id="markSummary"></p>
            <button type="button" class="btn-all" id="allPresentBtn">Mark all present</button>
            <div id="markList"></div>

            <div id="flexSection" style="display: none;">
                <h2 class="att-section" style="margin-top: 1.4rem;">10-Class Pass holders</h2>
                <select class="dropin-input" id="flexSelect"></select>
            </div>

            <h2 class="att-section" style="margin-top: 1.4rem;">Drop-in</h2>
            <input type="search" class="dropin-input" id="dropinSearch"
                placeholder="Search name or email to add...">
            <div id="dropinResults"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/axcent-passes.js"></script>
    <script type="module">
        import { supabase } from './assets/js/supabase-client.js';

        const OWNER_EMAIL = 'info@axcentdance.com';
        const FLEX_PASS = '10-Class Flexible Package';
        const WEEK_ORDER = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const DAY_NUMBERS = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };

        const el = (id) => document.getElementById(id);
        const show = (id) => { el(id).style.display = 'block'; };
        const hide = (id) => { el(id).style.display = 'none'; };
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        const iso = (d) => d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');

        const shortDate = (isoStr) => new Date(isoStr + 'T00:00:00')
            .toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = '_login.html';
            throw new Error('Not authenticated');
        }
        if (session.user.email.toLowerCase() !== OWNER_EMAIL) {
            el('gateMessage').innerHTML = 'This page is reserved for studio staff.';
            throw new Error('Not the owner');
        }

        // ----- Data ---------------------------------------------------------
        const [regRes, attRes] = await Promise.all([
            supabase.from('registrations').select('*').neq('status', 'pending_payment'),
            supabase.from('attendance').select('*')
        ]);
        if (regRes.error || attRes.error) {
            el('gateMessage').textContent = 'Could not load data: ' +
                (regRes.error || attRes.error).message;
            throw new Error('Load failed');
        }
        const registrations = regRes.data;
        let attendance = attRes.data;
        hide('gateCard');

        const classDefs = window.AXCENT_PASSES.classes.map(c => {
            const m = c.value.match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (\d{1,2}:\d{2}) /);
            return m ? { value: c.value, day: m[1], time: m[2], name: c.en } : null;
        }).filter(Boolean);
        const classDays = [...new Set(classDefs.map(c => c.day))]
            .sort((a, b) => WEEK_ORDER.indexOf(a) - WEEK_ORDER.indexOf(b));

        // ----- State --------------------------------------------------------
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const mondayOf = (d) => {
            const out = new Date(d);
            out.setDate(out.getDate() - ((out.getDay() + 6) % 7));
            return out;
        };
        const currentMonday = mondayOf(today);
        let weekOffset = 0;      // 0 = current week, -1 = last week...
        let selDay = classDays.includes(WEEK_ORDER[(today.getDay() + 6) % 7])
            ? WEEK_ORDER[(today.getDay() + 6) % 7] : classDays[0];
        let selClass = null;

        const weekMonday = () => {
            const d = new Date(currentMonday);
            d.setDate(d.getDate() + weekOffset * 7);
            return d;
        };
        const dateForDay = (day) => {
            const d = new Date(weekMonday());
            d.setDate(d.getDate() + ((DAY_NUMBERS[day] + 6) % 7));
            return iso(d);
        };

        const markFor = (regId) => attendance.find(a =>
            a.registration_id === regId && a.class_value === selClass &&
            a.class_date === dateForDay(selDay));

        const flexUsed = (regId) => attendance.filter(a =>
            a.registration_id === regId && a.status === 'present').length;

        // ----- Rendering ----------------------------------------------------
        function renderPicker() {
            const mon = weekMonday();
            const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
            el('weekLabel').textContent = shortDate(iso(mon)) + ' – ' + shortDate(iso(sun)) +
                (weekOffset === 0 ? ' (this week)' : '');
            el('nextWeek').disabled = weekOffset >= 0;

            el('dayChips').innerHTML = classDays.map(d =>
                '<button type="button" class="chip' + (d === selDay ? ' chip--active' : '') +
                '" data-day="' + d + '">' + d + ' ' + shortDate(dateForDay(d)) + '</button>'
            ).join('');

            const dayClasses = classDefs.filter(c => c.day === selDay);
            if (!dayClasses.some(c => c.value === selClass)) selClass = dayClasses[0]?.value || null;
            el('classChips').innerHTML = dayClasses.map(c =>
                '<button type="button" class="chip' + (c.value === selClass ? ' chip--active' : '') +
                '" data-class="' + esc(c.value) + '">' + esc(c.time + ' ' + c.name) + '</button>'
            ).join('');
            show('pickCard');
        }

        function rosterForSelection() {
            const dateStr = dateForDay(selDay);
            const enrolled = registrations.filter(r =>
                (r.status === 'active' || r.status === 'expired') &&
                (!r.pass_start_date || r.pass_start_date <= dateStr) &&
                (!r.pass_end_date || r.pass_end_date >= dateStr) &&
                (r.selected_classes || '').split(', ').some(entry =>
                    entry.trim().replace(/ \((Leader|Follower)\)$/, '') === selClass)
            );
            // Marked people outside the roster (drop-ins, flex passes).
            const extraIds = attendance
                .filter(a => a.class_value === selClass && a.class_date === dateStr)
                .map(a => a.registration_id)
                .filter(id => !enrolled.some(r => r.id === id));
            const extras = registrations.filter(r => extraIds.includes(r.id));
            return { enrolled, extras };
        }

        const roleFor = (r) => {
            const entry = (r.selected_classes || '').split(', ')
                .map(s => s.trim())
                .find(s => s.replace(/ \((Leader|Follower)\)$/, '') === selClass);
            const m = entry && entry.match(/\((Leader|Follower)\)$/);
            return m ? m[1] : null;
        };

        function renderMarks() {
            if (!selClass) { hide('markCard'); return; }
            const def = classDefs.find(c => c.value === selClass);
            const dateStr = dateForDay(selDay);
            el('markTitle').textContent = def.name + ' — ' +
                new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', {
                    weekday: 'long', month: 'long', day: 'numeric'
                });

            const { enrolled, extras } = rosterForSelection();

            const row = (r, isDropin) => {
                const mark = markFor(r.id);
                const state = mark ? mark.status : null;
                const role = roleFor(r);
                const isFlex = r.pass_type === FLEX_PASS;
                return '<button type="button" class="att-row' +
                    (state === 'present' ? ' att-row--present' : '') +
                    (state === 'absent' ? ' att-row--absent' : '') +
                    (isDropin ? ' att-row--dropin' : '') +
                    '" data-reg="' + r.id + '" data-email="' + esc(r.email) + '">' +
                    '<span class="att-row__name">' + esc(((r.first_name || '') + ' ' + (r.last_name || '')).trim() || r.email) + '</span>' +
                    (isFlex ? '<span class="att-row__flex">' + flexUsed(r.id) + ' of 10</span>' : '') +
                    (role ? '<span class="att-row__role">' + role.slice(0, 1) + '</span>' : '') +
                    '<span class="att-row__state">' + (state ? state : 'tap') + '</span>' +
                    '</button>';
            };

            el('markList').innerHTML =
                enrolled.map(r => row(r, false)).join('') +
                extras.map(r => row(r, true)).join('') ||
                '<p class="muted-note">Nobody enrolled for this class on this date.</p>';

            const all = enrolled.concat(extras);
            const present = all.filter(r => markFor(r.id)?.status === 'present').length;
            const absent = all.filter(r => markFor(r.id)?.status === 'absent').length;
            el('markSummary').innerHTML = '<strong>' + present + ' present</strong> · ' +
                absent + ' absent · ' + (all.length - present - absent) + ' unmarked';

            // Flexible-pass holders are never on a fixed roster; the drop
            // list marks them present for this class with one pick.
            const listedIds = all.map(r => r.id);
            const flexHolders = registrations.filter(r =>
                r.status === 'active' && r.pass_type === FLEX_PASS && !listedIds.includes(r.id));
            if (flexHolders.length) {
                el('flexSelect').innerHTML =
                    '<option value="">Mark a 10-class pass holder present...</option>' +
                    flexHolders.map(r =>
                        '<option value="' + r.id + '">' +
                        esc(((r.first_name || '') + ' ' + (r.last_name || '')).trim() || r.email) +
                        ' — ' + flexUsed(r.id) + ' of 10 used</option>'
                    ).join('');
                show('flexSection');
            } else {
                hide('flexSection');
            }
            show('markCard');
        }

        // ----- Writes -------------------------------------------------------
        async function setMark(regId, email, status) {
            const dateStr = dateForDay(selDay);
            if (status === null) {
                const { error } = await supabase.from('attendance').delete()
                    .eq('registration_id', regId).eq('class_value', selClass).eq('class_date', dateStr);
                if (error) { alert(error.message); return; }
                attendance = attendance.filter(a => !(a.registration_id === regId &&
                    a.class_value === selClass && a.class_date === dateStr));
            } else {
                const { data, error } = await supabase.from('attendance').upsert({
                    class_value: selClass, class_date: dateStr,
                    registration_id: regId, email: email, status: status
                }, { onConflict: 'class_date,class_value,registration_id' }).select();
                if (error) { alert(error.message); return; }
                attendance = attendance.filter(a => !(a.registration_id === regId &&
                    a.class_value === selClass && a.class_date === dateStr)).concat(data);
            }
            renderMarks();
        }

        // ----- Events -------------------------------------------------------
        el('prevWeek').addEventListener('click', () => { weekOffset--; renderPicker(); renderMarks(); });
        el('nextWeek').addEventListener('click', () => {
            if (weekOffset < 0) { weekOffset++; renderPicker(); renderMarks(); }
        });
        el('dayChips').addEventListener('click', (e) => {
            const chip = e.target.closest('[data-day]');
            if (!chip) return;
            selDay = chip.dataset.day;
            renderPicker(); renderMarks();
        });
        el('classChips').addEventListener('click', (e) => {
            const chip = e.target.closest('[data-class]');
            if (!chip) return;
            selClass = chip.dataset.class;
            renderPicker(); renderMarks();
        });

        // Tap cycles: unmarked -> present -> absent -> unmarked
        el('markList').addEventListener('click', (e) => {
            const rowBtn = e.target.closest('.att-row');
            if (!rowBtn) return;
            const mark = markFor(rowBtn.dataset.reg);
            const next = !mark ? 'present' : mark.status === 'present' ? 'absent' : null;
            setMark(rowBtn.dataset.reg, rowBtn.dataset.email, next);
        });

        el('allPresentBtn').addEventListener('click', async () => {
            const { enrolled } = rosterForSelection();
            for (const r of enrolled) {
                if (!markFor(r.id)) await setMark(r.id, r.email, 'present');
            }
        });

        el('dropinSearch').addEventListener('input', () => {
            const q = el('dropinSearch').value.trim().toLowerCase();
            if (q.length < 2) { el('dropinResults').innerHTML = ''; return; }
            const { enrolled, extras } = rosterForSelection();
            const listed = enrolled.concat(extras).map(r => r.id);
            const hits = registrations.filter(r =>
                r.status === 'active' && !listed.includes(r.id) &&
                (((r.first_name || '') + ' ' + (r.last_name || '')).toLowerCase().includes(q) ||
                    r.email.toLowerCase().includes(q))
            ).slice(0, 6);
            el('dropinResults').innerHTML = hits.map(r =>
                '<button type="button" class="dropin-result" data-reg="' + r.id +
                '" data-email="' + esc(r.email) + '">' +
                esc(((r.first_name || '') + ' ' + (r.last_name || '')).trim() || r.email) +
                (r.pass_type === FLEX_PASS ? ' <span class="att-row__flex">flex ' + flexUsed(r.id) + ' of 10</span>' : '') +
                ' <span class="muted-note">' + esc(r.email) + '</span></button>'
            ).join('') || '<p class="muted-note">No matching active pass.</p>';
        });

        el('dropinResults').addEventListener('click', async (e) => {
            const hit = e.target.closest('.dropin-result');
            if (!hit) return;
            await setMark(hit.dataset.reg, hit.dataset.email, 'present');
            el('dropinSearch').value = '';
            el('dropinResults').innerHTML = '';
        });

        el('flexSelect').addEventListener('change', async () => {
            const regId = el('flexSelect').value;
            if (!regId) return;
            const reg = registrations.find(r => r.id === regId);
            if (reg) await setMark(reg.id, reg.email, 'present');
        });

        renderPicker();
        renderMarks();
    </script>
</body>

</html>
