  {

          { "href_matches": "/*" },

    }],

      "where": {
        "href_matches": ["/", "/about", "/schedule", "/registration", "/events",

<body class="tropic">
    <div class="att-container">
        <div class="att-header">
            <div>
                <p class="att-eyebrow">AXcent Dance</p>
                <h1>Sign Presences</h1>
            </div>
            <a class="att-link" href="_admin" id="dashboardLink" style="display: none;">Dashboard</a>
        </div>

        <div class="att-card" id="gateCard">
            <p class="muted-note" id="gateMessage">Checking access...</p>
        </div>

        <div class="att-card" id="hoursCard" style="display: none;">
            <h2 class="att-section" id="hoursName"></h2>
            <p style="margin: 0; font-family: 'Outfit', sans-serif;">
                <span id="hoursValue"
                    style="font-size: 2rem; font-weight: 800; color: var(--accent-gold);"></span>
                <span id="hoursUnit" style="color: var(--text-muted); margin-left: 6px;"></span>
            </p>
            <p class="muted-note" id="hoursBreakdown" style="margin: 8px 0 0; font-size: 0.85rem;"></p>
        </div>

        <div class="att-card" id="pickCard" style="display: none;">
            <div class="week-bar">
                <button type="button" id="prevWeek" aria-label="Previous week">&larr;</button>
                <span class="week-bar__label" id="weekLabel"></span>
                <button type="button" id="nextWeek" aria-label="Next week">&rarr;</button>
            </div>
            <div class="chip-row" id="dayChips"></div>
            <div class="chip-row" id="classChips"></div>
        </div>

        <div class="att-card" id="markCard" style="display: none;">
            <h2 class="att-section" id="markTitle"></h2>
            <p id="signState" style="margin: 0 0 8px; font-size: 0.9rem; color: var(--text-main);"></p>
            <button type="button" id="signBtn" class="btn-all" style="display: none;"></button>
            <p class="att-summary" id="markSummary"></p>
            <button type="button" class="btn-all" id="allPresentBtn">Mark all present</button>
            <div id="markList"></div>

            <div id="flexSection" style="display: none;">
                <h2 class="att-section" style="margin-top: 1.4rem;">10-Class Pass holders</h2>
                <select class="dropin-input" id="flexSelect"></select>
            </div>

            <h2 class="att-section" style="margin-top: 1.4rem;">Drop-in</h2>
            <input type="search" class="dropin-input" id="dropinSearch"
                placeholder="Search name or email to add...">
            <div id="dropinResults"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="assets/js/axcent-passes.js"></script>
    <script type="module">
        import { supabase } from './assets/js/supabase-client.js';

        const OWNER_EMAIL = 'info@axcentdance.com';
        const FLEX_PASS = '10-Class Flexible Package';
        const WEEK_ORDER = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const DAY_NUMBERS = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };

        const el = (id) => document.getElementById(id);
        const show = (id) => { el(id).style.display = 'block'; };
        const hide = (id) => { el(id).style.display = 'none'; };
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        const iso = (d) => d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');

        const shortDate = (isoStr) => new Date(isoStr + 'T00:00:00')
            .toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = '_login.html';
            throw new Error('Not authenticated');
        }
        // Open to the owner and to any active teacher: teachers log their own // classes here, which is what the 24h reminder email links to.
        const isOwner = session.user.email.toLowerCase() === OWNER_EMAIL;
        const { data: meTeacher } = await supabase.from('teachers')
            .select('*').ilike('email', session.user.email).maybeSingle();
        const isTeacher = !!(meTeacher && meTeacher.active);
        if (!isOwner && !isTeacher) {
            el('gateMessage').innerHTML = 'This page is reserved for studio staff.';
            throw new Error('Not staff');
        }
        // The dashboard is owner-only; showing it to teachers is a dead end.
        if (isOwner) el('dashboardLink').style.display = '';

        // ----- Data ---------------------------------------------------------
        const [regRes, attRes, teachersRes, ctRes, sessRes, hoursRes] = await Promise.all([
            supabase.from('registrations').select('*').neq('status', 'pending_payment'),
            supabase.from('attendance').select('*'),
            supabase.from('teachers').select('*').order('first_name', { ascending: true }),
            supabase.from('class_teachers').select('*'),
            supabase.from('class_sessions').select('*'),
            supabase.rpc('teaching_hours')
        ]);
        const teachers = teachersRes.data || [];
        const classTeachers = ctRes.data || [];
        let classSessions = sessRes.data || [];
        const teachingHours = hoursRes.data || [];
        const teacherName = (t) => ((t.first_name || '') + ' ' + (t.last_name || '')).trim() || t.email;

        // A teacher sees their own running total; the owner sees everyone's.
        if (isTeacher) {
            // my_teaching_hours() returns only the caller's own total, so a
            // teacher never sees a colleague's hours.
            const { data: myHrs } = await supabase.rpc('my_teaching_hours');
            const hrs = Number(myHrs || 0);
            el('hoursValue').textContent = hrs;
            el('hoursUnit').textContent = hrs === 1 ? 'hour taught' : 'hours taught';
            el('hoursName').textContent = 'Hi ' + (meTeacher.first_name || 'there');
            show('hoursCard');
        } else if (teachingHours.length) {
            el('hoursName').textContent = 'Teaching hours';
            el('hoursValue').textContent = teachingHours.reduce((s, h) => s + Number(h.sessions), 0);
            el('hoursUnit').textContent = 'hours logged in total';
            el('hoursBreakdown').innerHTML = teachingHours.map(h =>
                esc(((h.first_name || '') + ' ' + (h.last_name || '')).trim() || h.email) +
                ': <strong>' + Number(h.sessions) + '</strong>').join(' · ');
            show('hoursCard');
        }

        if (regRes.error || attRes.error) {
            el('gateMessage').textContent = 'Could not load data: ' +
                (regRes.error || attRes.error).message;
            throw new Error('Load failed');
        }
        const registrations = regRes.data;
        let attendance = attRes.data;
        hide('gateCard');

        const classDefs = window.AXCENT_PASSES.classes.map(c => {
            const m = c.value.match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (\d{1,2}:\d{2}) /);
            return m ? { value: c.value, day: m[1], time: m[2], name: c.en } : null;
        }).filter(Boolean);
        // A teacher only ever works with the classes they are assigned to.
        const myClassValues = isOwner ? null : new Set(
            classTeachers.filter(ct => ct.teacher_id === meTeacher.id).map(ct => ct.class_value));
        const visibleClasses = isOwner
            ? classDefs
            : classDefs.filter(c => myClassValues.has(c.value));
        const classDays = [...new Set(visibleClasses.map(c => c.day))]
            .sort((a, b) => WEEK_ORDER.indexOf(a) - WEEK_ORDER.indexOf(b));

        // ----- State --------------------------------------------------------
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const mondayOf = (d) => {
            const out = new Date(d);
            out.setDate(out.getDate() - ((out.getDay() + 6) % 7));
            return out;
        };
        const currentMonday = mondayOf(today);
        let weekOffset = 0;      // 0 = current week, -1 = last week...
        let selDay = classDays.includes(WEEK_ORDER[(today.getDay() + 6) % 7])
            ? WEEK_ORDER[(today.getDay() + 6) % 7] : classDays[0];
        let selClass = null;

        const weekMonday = () => {
            const d = new Date(currentMonday);
            d.setDate(d.getDate() + weekOffset * 7);
            return d;
        };
        const dateForDay = (day) => {
            const d = new Date(weekMonday());
            d.setDate(d.getDate() + ((DAY_NUMBERS[day] + 6) % 7));
            return iso(d);
        };

        const markFor = (regId) => attendance.find(a =>
            a.registration_id === regId && a.class_value === selClass &&
            a.class_date === dateForDay(selDay));

        const flexUsed = (regId) => attendance.filter(a =>
            a.registration_id === regId && a.status === 'present').length;

        // ----- Rendering ----------------------------------------------------
        function renderPicker() {
            const mon = weekMonday();
            const sun = new Date(mon); sun.setDate(sun.getDate() + 6); el('weekLabel').textContent = shortDate(iso(mon)) + ' to ' + shortDate(iso(sun)) + (weekOffset === 0 ? ' (this week)' : '');
            el('nextWeek').disabled = weekOffset >= 0;

            el('dayChips').innerHTML = classDays.map(d =>
                '<button type="button" class="chip' + (d === selDay ? ' chip--active' : '') +
                '" data-day="' + d + '">' + d + ' ' + shortDate(dateForDay(d)) + '</button>'
            ).join('');

            const dayClasses = visibleClasses.filter(c => c.day === selDay);
            if (!dayClasses.some(c => c.value === selClass)) selClass = dayClasses[0]?.value || null;
            el('classChips').innerHTML = dayClasses.map(c =>
                '<button type="button" class="chip' + (c.value === selClass ? ' chip--active' : '') +
                '" data-class="' + esc(c.value) + '">' + esc(c.time + ' ' + c.name) + '</button>'
            ).join('');
            show('pickCard');
        }

        // Normalised roster row: { id, name, role, status, isFlex, flexUsed, dropin }
        // Teachers get theirs from the class_roster function, which returns
        // names only and refuses classes they are not assigned to; the owner
        // builds it locally from the full records they are allowed to read.
        async function rosterForSelection() {
            const dateStr = dateForDay(selDay);
            if (!isOwner) {
                const { data, error } = await supabase.rpc('class_roster',
                    { cv: selClass, cd: dateStr });
                if (error) { console.error(error); return []; }
                return (data || []).map(r => ({
                    id: r.registration_id,
                    name: ((r.first_name || '') + ' ' + (r.last_name || '')).trim() || 'Unknown',
                    role: r.role, status: r.status, isFlex: false, dropin: false
                }));
            }
            const roleFor = (r) => {
                const entry = (r.selected_classes || '').split(', ').map(s => s.trim())
                    .find(s => s.replace(/ \((Leader|Follower)\)$/, '') === selClass);
                const m = entry && entry.match(/\((Leader|Follower)\)$/);
                return m ? m[1] : null;
            };
            const enrolled = registrations.filter(r =>
                (r.status === 'active' || r.status === 'expired') &&
                (!r.pass_start_date || r.pass_start_date <= dateStr) &&
                (!r.pass_end_date || r.pass_end_date >= dateStr) &&
                (r.selected_classes || '').split(', ').some(entry =>
                    entry.trim().replace(/ \((Leader|Follower)\)$/, '') === selClass)
            );
            const extraIds = attendance
                .filter(a => a.class_value === selClass && a.class_date === dateStr)
                .map(a => a.registration_id)
                .filter(id => !enrolled.some(r => r.id === id));
            const extras = registrations.filter(r => extraIds.includes(r.id));
            const toRow = (r, dropin) => ({
                id: r.id,
                name: ((r.first_name || '') + ' ' + (r.last_name || '')).trim() || r.email,
                role: roleFor(r), status: markFor(r.id)?.status ?? null,
                isFlex: r.pass_type === FLEX_PASS, flexUsed: flexUsed(r.id), dropin
            });
            return enrolled.map(r => toRow(r, false)).concat(extras.map(r => toRow(r, true)));
        }

        async function renderMarks() {
            if (!selClass) { hide('markCard'); return; }
            const def = classDefs.find(c => c.value === selClass);
            const dateStr = dateForDay(selDay); el('markTitle').textContent = def.name + ' · ' + new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric'
                });

            const roster = await rosterForSelection();

            el('markList').innerHTML = roster.length
                ? roster.map(r =>
                    '<button type="button" class="att-row' +
                    (r.status === 'present' ? ' att-row--present' : '') +
                    (r.status === 'absent' ? ' att-row--absent' : '') +
                    (r.dropin ? ' att-row--dropin' : '') +
                    '" data-reg="' + r.id + '">' +
                    '<span class="att-row__name">' + esc(r.name) + '</span>' +
                    (r.isFlex ? '<span class="att-row__flex">' + r.flexUsed + ' of 10</span>' : '') +
                    (r.role ? '<span class="att-row__role">' + r.role.slice(0, 1) + '</span>' : '') +
                    '<span class="att-row__state">' + (r.status ? r.status : 'tap') + '</span>' +
                    '</button>').join('')
                : '<p class="muted-note">Nobody enrolled for this class on this date.</p>';

            const present = roster.filter(r => r.status === 'present').length;
            const absent = roster.filter(r => r.status === 'absent').length;
            el('markSummary').innerHTML = '<strong>' + present + ' present</strong> · ' +
                absent + ' absent · ' + (roster.length - present - absent) + ' unmarked';

            if (isOwner) {
                // Flexible-pass holders sit on no fixed roster; the owner can
                // drop one into any class. Teachers do not get this list: // it would expose students outside their own class.
                const listedIds = roster.map(r => r.id);
                const flexHolders = registrations.filter(r =>
                    r.status === 'active' && r.pass_type === FLEX_PASS && !listedIds.includes(r.id));
                if (flexHolders.length) {
                    el('flexSelect').innerHTML =
                        '<option value="">Mark a 10-class pass holder present...</option>' +
                        flexHolders.map(r =>
                            '<option value="' + r.id + '">' +
                            esc(((r.first_name || '') + ' ' + (r.last_name || '')).trim() || r.email) + ' · ' + flexUsed(r.id) + ' of 10 used</option>').join(''); show('flexSection');
                } else {
                    hide('flexSection');
                }
            }

            // Teaching hour: the teacher signs their own; the owner only sees
            // who signed, and cannot sign on anybody's behalf.
            const signed = classSessions.find(s =>
                s.class_value === selClass && s.class_date === dateStr);
            const signedBy = signed && signed.teacher_id
                ? teachers.find(t => t.id === signed.teacher_id) : null;
            if (isOwner) {
                el('signState').innerHTML = signedBy
                    ? 'Signed by <strong>' + esc(teacherName(signedBy)) + '</strong>'
                    : '<span class="muted-note">Not signed by a teacher yet</span>';
                hide('signBtn');
            } else {
                const mineSigned = signedBy && signedBy.id === meTeacher.id;
                el('signState').innerHTML = mineSigned
                    ? '<strong style="color: #8FD9A0;">You signed this teaching hour</strong>'
                    : (signedBy
                        ? 'Signed by <strong>' + esc(teacherName(signedBy)) + '</strong>'
                        : '<span class="muted-note">Not signed yet</span>');
                el('signBtn').textContent = mineSigned
                    ? 'Undo my signature' : 'I taught this class';
                el('signBtn').dataset.signed = mineSigned ? 'yes' : 'no';
                show('signBtn');
            }

            show('markCard');
        }

        // ----- Writes -------------------------------------------------------
        async function setMark(regId, status) {
            const dateStr = dateForDay(selDay);
            const { error } = await supabase.rpc('mark_attendance',
                { cv: selClass, cd: dateStr, reg: regId, st: status });
            if (error) { alert(error.message); return; }

            // Keep the owner's local cache in step; teachers re-read the
            // roster from the server, which already carries the status.
            attendance = attendance.filter(a => !(a.registration_id === regId &&
                a.class_value === selClass && a.class_date === dateStr));
            if (status) {
                attendance.push({ registration_id: regId, class_value: selClass,
                    class_date: dateStr, status: status });
            }
            await renderMarks();
        }

        async function toggleSignature() {
            const dateStr = dateForDay(selDay);
            const taught = el('signBtn').dataset.signed !== 'yes';
            const { error } = await supabase.rpc('sign_teaching',
                { cv: selClass, cd: dateStr, taught: taught });
            if (error) { alert(error.message); return; }
            const { data } = await supabase.from('class_sessions').select('*');
            classSessions = data || [];
            const { data: newHrs } = await supabase.rpc('my_teaching_hours');
            const n = Number(newHrs || 0);
            el('hoursValue').textContent = n;
            el('hoursUnit').textContent = n === 1 ? 'hour taught' : 'hours taught';
            await renderMarks();
        }

        // ----- Events -------------------------------------------------------
        el('prevWeek').addEventListener('click', () => { weekOffset--; renderPicker(); renderMarks(); });
        el('nextWeek').addEventListener('click', () => {
            if (weekOffset < 0) { weekOffset++; renderPicker(); renderMarks(); }
        });
        el('dayChips').addEventListener('click', (e) => {
            const chip = e.target.closest('[data-day]');
            if (!chip) return;
            selDay = chip.dataset.day;
            renderPicker(); renderMarks();
        });
        el('classChips').addEventListener('click', (e) => {
            const chip = e.target.closest('[data-class]');
            if (!chip) return;
            selClass = chip.dataset.class;
            renderPicker(); renderMarks();
        });

        // Tap cycles: unmarked -> present -> absent -> unmarked
        el('markList').addEventListener('click', async (e) => {
            const rowBtn = e.target.closest('.att-row');
            if (!rowBtn) return;
            const current = rowBtn.querySelector('.att-row__state').textContent;
            const next = current === 'tap' ? 'present' : current === 'present' ? 'absent' : null;
            await setMark(rowBtn.dataset.reg, next);
        });

        el('allPresentBtn').addEventListener('click', async () => {
            const unmarked = [...document.querySelectorAll('#markList .att-row')]
                .filter(b => b.querySelector('.att-row__state').textContent === 'tap')
                .map(b => b.dataset.reg);
            for (const id of unmarked) await setMark(id, 'present');
        });

        el('dropinSearch').addEventListener('input', () => {
            const q = el('dropinSearch').value.trim().toLowerCase();
            if (q.length < 2) { el('dropinResults').innerHTML = ''; return; }
            const { enrolled, extras } = rosterForSelection();
            const listed = enrolled.concat(extras).map(r => r.id);
            const hits = registrations.filter(r =>
                r.status === 'active' && !listed.includes(r.id) &&
                (((r.first_name || '') + ' ' + (r.last_name || '')).toLowerCase().includes(q) ||
                    r.email.toLowerCase().includes(q))
            ).slice(0, 6);
            el('dropinResults').innerHTML = hits.map(r =>
                '<button type="button" class="dropin-result" data-reg="' + r.id +
                '" data-email="' + esc(r.email) + '">' +
                esc(((r.first_name || '') + ' ' + (r.last_name || '')).trim() || r.email) +
                (r.pass_type === FLEX_PASS ? ' <span class="att-row__flex">flex ' + flexUsed(r.id) + ' of 10</span>' : '') +
                ' <span class="muted-note">' + esc(r.email) + '</span></button>'
            ).join('') || '<p class="muted-note">No matching active pass.</p>';
        });

        el('dropinResults').addEventListener('click', async (e) => {
            const hit = e.target.closest('.dropin-result');
            if (!hit) return;
            await setMark(hit.dataset.reg, 'present');
            el('dropinSearch').value = '';
            el('dropinResults').innerHTML = '';
        });

        el('signBtn').addEventListener('click', toggleSignature);

        el('flexSelect').addEventListener('change', async () => {
            const regId = el('flexSelect').value;
            if (!regId) return;
            const reg = registrations.find(r => r.id === regId);
            if (reg) await setMark(reg.id, 'present');
        });

        // Drop-in search scans every active student, so it stays owner-only.
        if (!isOwner) {
            const dropinHeading = [...document.querySelectorAll('h2.att-section')]
                .find(h => h.textContent.trim() === 'Drop-in');
            if (dropinHeading) dropinHeading.style.display = 'none';
            el('dropinSearch').style.display = 'none';
        }

        renderPicker();
        renderMarks();
    </script>
</body>

</html>
