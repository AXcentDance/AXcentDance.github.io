<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://axcentdance.com/_signup">
    <link rel="alternate" hreflang="en" href="https://axcentdance.com/_signup">
    <link rel="alternate" hreflang="de" href="https://axcentdance.com/de/_signup">
    <link rel="alternate" hreflang="x-default" href="https://axcentdance.com/_signup">
    <title>Sign Up - AXcent Dance</title>
    <meta name="description" content="Create your AXcent Dance account to view your current pass and declare absence days.">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://jwravnvytkmsvqoqkmwb.supabase.co; object-src 'none'; base-uri 'self';">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-200-900-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/outfit-500-800-latin.woff2" crossorigin>
    <link rel="stylesheet" href="style.css?v=10.1">
    <link rel="stylesheet" href="tropic-noir.css?v=6.1">
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
    <link rel="icon" href="/favicon-axcent-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/favicon-axcent-transparent.svg" type="image/svg+xml">
    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: white;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .auth-card .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .auth-card .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .auth-card .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid var(--accent-start);
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }

        .btn-auth:hover {
            opacity: 0.9;
        }

        .auth-link {
            display: block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-link a {
            color: var(--accent-gold);
            text-decoration: none;
        }

        #feedback {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            display: none;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            display: block !important;
        }

        .success {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            display: block !important;
        }
    </style>
  <script type="speculationrules">
  {
    "prefetch": [{
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/assets/*" } }
        ]
      },
      "eagerness": "moderate"
    }]
  }
  </script>
</head>

<body style="padding-top: 80px;">

    <header class="main-header">
        <div class="container navbar">
            <a href="/" class="logo">
                <span class="logo-title">AXCENT</span><span class="logo-subtitle text-gradient">DANCE</span>
            </a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/de/_signup" aria-label="Deutsche Version">DE</a>
            </nav>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Create Your Account</h1>
            <p class="auth-subtitle">Use the same email you registered your pass with, so we can show you your pass
                details automatically.</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="8" autocomplete="new-password"
                        placeholder="At least 8 characters">
                </div>
                <button type="submit" class="btn-auth">Sign Up</button>
            </form>

            <div id="feedback"></div>

            <p class="auth-link" id="resendWrap" style="display: none;">
                Did not receive the email? <a href="#" id="resendLink">Resend confirmation</a>
            </p>

            <p class="auth-link">
                Already have an account? <a href="_login">Log In</a>
                <br><br>
                <a href="/" style="opacity: 0.6;">← Back to Website</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase } from './assets/js/supabase-client.js';

        const form = document.getElementById('signupForm');
        const feedback = document.getElementById('feedback');
        const emailInput = document.getElementById('email');

        // Welcome emails link here with the purchase email prefilled, so the
        // account always matches the email the pass is registered under.
        const prefill = new URLSearchParams(window.location.search).get('email');
        if (prefill) emailInput.value = prefill;

        // "Resend confirmation" escape hatch: without it, a confirmation
        // email lost to spam leaves the account stuck in limbo.
        let lastSignupEmail = null;
        const resendWrap = document.getElementById('resendWrap');
        document.getElementById('resendLink').addEventListener('click', async (e) => {
            e.preventDefault();
            if (!lastSignupEmail) return;
            const { error } = await supabase.auth.resend({ type: 'signup', email: lastSignupEmail });
            if (error) {
                feedback.textContent = error.message;
                feedback.className = 'error';
            } else {
                feedback.textContent = 'Confirmation email sent again — please also check your spam folder.';
                feedback.className = 'success';
            }
        });

        const NO_PASS_MESSAGE = 'No pass is registered under this email. Please use the exact email from your ' +
            'pass purchase — if you just paid, wait a minute and try again. ' +
            'New to AXcent? <a href="registration" style="color: var(--accent-start, #E8B04B);">Register for a class</a> first.';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedback.textContent = 'Creating your account...';
            feedback.className = '';
            feedback.style.display = 'block';

            // Friendly pre-check: accounts exist only for emails with a real
            // pass (a database trigger enforces this regardless).
            const { data: hasPass, error: checkError } = await supabase
                .rpc('email_has_profile', { check_email: emailInput.value });
            if (!checkError && hasPass === false) {
                feedback.innerHTML = NO_PASS_MESSAGE;
                feedback.className = 'error';
                return;
            }

            const { data, error } = await supabase.auth.signUp({
                email: emailInput.value,
                password: document.getElementById('password').value,
            });

            if (error) {
                // The trigger rejection surfaces as a generic database error.
                if ((error.message || '').toLowerCase().includes('database error') ||
                    (error.message || '').includes('registered pass')) {
                    feedback.innerHTML = NO_PASS_MESSAGE;
                } else {
                    feedback.textContent = error.message;
                }
                feedback.className = 'error';
            } else if (data.session) {
                // Email confirmation disabled: signed in immediately.
                feedback.textContent = 'Account created! Redirecting...';
                feedback.className = 'success';
                setTimeout(() => { window.location.href = 'portal.html'; }, 800);
            } else {
                feedback.textContent = 'Account created! Please check your email to confirm your address, then log in.';
                feedback.className = 'success';
                lastSignupEmail = emailInput.value;
                resendWrap.style.display = 'block';
            }
        });
    </script>
</body>

</html>
