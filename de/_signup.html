<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#061A17">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://axcentdance.com/de/_signup">
    <link rel="alternate" hreflang="en" href="https://axcentdance.com/_signup">
    <link rel="alternate" hreflang="de" href="https://axcentdance.com/de/_signup">
    <link rel="alternate" hreflang="x-default" href="https://axcentdance.com/_signup">
    <title>Registrieren - AXcent Dance</title>
    <meta name="description" content="Erstelle dein AXcent Dance Konto, um deinen aktuellen Pass zu sehen und Abwesenheitstage anzugeben.">
    <meta property="og:description" content="Erstelle dein AXcent Dance Konto, um deinen aktuellen Pass zu sehen und Abwesenheitstage anzugeben.">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://jwravnvytkmsvqoqkmwb.supabase.co; object-src 'none'; base-uri 'self';">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-200-900-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/outfit-500-800-latin.woff2" crossorigin>
    <link rel="stylesheet" href="../style.css?v=10.3">
    <link rel="stylesheet" href="../tropic-noir.css?v=6.1">
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
    <link rel="icon" href="/favicon-axcent-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/favicon-axcent-transparent.svg" type="image/svg+xml">
    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: white;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .auth-card .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .auth-card .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .auth-card .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid var(--accent-start);
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }

        .btn-auth:hover {
            opacity: 0.9;
        }

        .auth-link {
            display: block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-link a {
            color: var(--accent-gold);
            text-decoration: none;
        }

        #feedback {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            display: none;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            display: block !important;
        }

        .success {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            display: block !important;
        }
    </style>
  <script type="speculationrules">
  {
    "prefetch": [{
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/assets/*" } }
        ]
      },
      "eagerness": "moderate"
    }],
    "prerender": [{
      "where": {
        "href_matches": ["/", "/about", "/schedule", "/registration", "/events",
                         "/de/", "/de/about", "/de/schedule", "/de/registration", "/de/events"]
      },
      "eagerness": "moderate"
    }]
  }
  </script>
</head>

<body style="padding-top: 80px;">

    <header class="main-header">
        <div class="container navbar">
            <a href="/de/" class="logo">
                <span class="logo-title">AXCENT</span><span class="logo-subtitle text-gradient">DANCE</span>
            </a>
            <nav class="nav-links">
                <a href="/de/">Home</a>
                <a href="/_signup" aria-label="English version">EN</a>
            </nav>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Konto erstellen</h1>
            <p class="auth-subtitle">Verwende dieselbe E-Mail-Adresse, mit der du deinen Pass registriert hast, damit
                wir dir deine Pass-Details automatisch anzeigen können.</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="du@beispiel.ch">
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" required minlength="8" autocomplete="new-password"
                        placeholder="Mindestens 8 Zeichen">
                </div>
                <button type="submit" class="btn-auth">Registrieren</button>
            </form>

            <div id="feedback"></div>

            <p class="auth-link" id="resendWrap" style="display: none;">
                Keine E-Mail erhalten? <a href="#" id="resendLink">Bestätigung erneut senden</a>
            </p>

            <p class="auth-link">
                Bereits ein Konto? <a href="_login">Anmelden</a>
                <br><br>
                <a href="/de/" style="opacity: 0.6;">← Zurück zur Website</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase } from '../assets/js/supabase-client.js';

        const form = document.getElementById('signupForm');
        const feedback = document.getElementById('feedback');
        const emailInput = document.getElementById('email');

        // Willkommens-E-Mails verlinken hierher mit vorausgefüllter Kauf-E-Mail,
        // damit das Konto immer zur E-Mail des Passes passt.
        const prefill = new URLSearchParams(window.location.search).get('email');
        if (prefill) emailInput.value = prefill;

        // "Bestätigung erneut senden": ohne diesen Ausweg bleibt ein Konto
        // stecken, wenn die Bestätigungs-E-Mail im Spam landet.
        let lastSignupEmail = null;
        const resendWrap = document.getElementById('resendWrap');
        document.getElementById('resendLink').addEventListener('click', async (e) => {
            e.preventDefault();
            if (!lastSignupEmail) return;
            const { error } = await supabase.auth.resend({ type: 'signup', email: lastSignupEmail });
            if (error) {
                feedback.textContent = error.message;
                feedback.className = 'error';
            } else {
                feedback.textContent = 'Bestätigungs-E-Mail erneut gesendet — bitte prüfe auch deinen Spam-Ordner.';
                feedback.className = 'success';
            }
        });

        const NO_PASS_MESSAGE = 'Unter dieser E-Mail ist kein Pass registriert. Bitte verwende genau die E-Mail ' +
            'deines Pass-Kaufs — falls du gerade erst bezahlt hast, warte kurz und versuche es erneut. ' +
            'Neu bei AXcent? <a href="registration" style="color: var(--accent-start, #E8B04B);">Melde dich zuerst für einen Kurs an</a>.';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedback.textContent = 'Konto wird erstellt...';
            feedback.className = '';
            feedback.style.display = 'block';

            // Freundliche Vorprüfung: Konten gibt es nur für E-Mails mit einem
            // echten Pass (ein Datenbank-Trigger erzwingt das unabhängig davon).
            const { data: hasPass, error: checkError } = await supabase
                .rpc('email_has_profile', { check_email: emailInput.value });
            if (!checkError && hasPass === false) {
                feedback.innerHTML = NO_PASS_MESSAGE;
                feedback.className = 'error';
                return;
            }

            const { data, error } = await supabase.auth.signUp({
                email: emailInput.value,
                password: document.getElementById('password').value,
            });

            if (error) {
                // Die Trigger-Ablehnung erscheint als generischer Datenbankfehler.
                if ((error.message || '').toLowerCase().includes('database error') ||
                    (error.message || '').includes('registered pass')) {
                    feedback.innerHTML = NO_PASS_MESSAGE;
                } else {
                    feedback.textContent = error.message;
                }
                feedback.className = 'error';
            } else if (data.session) {
                // E-Mail-Bestätigung deaktiviert: direkt angemeldet.
                feedback.textContent = 'Konto erstellt! Weiterleitung...';
                feedback.className = 'success';
                setTimeout(() => { window.location.href = 'portal.html'; }, 800);
            } else {
                feedback.textContent = 'Konto erstellt! Bitte bestätige deine E-Mail-Adresse über den Link in deinem Posteingang und melde dich dann an.';
                feedback.className = 'success';
                lastSignupEmail = emailInput.value;
                resendWrap.style.display = 'block';
            }
        });
    </script>
</body>

</html>
