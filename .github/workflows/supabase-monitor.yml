name: Supabase Monitor

# Pings the Supabase REST API every 20 minutes. Two consecutive failures
# send a DOWN email to the studio (via FormSubmit, same channel the portal
# uses); the first successful check after a confirmed outage sends an UP
# email. Exactly one email per transition — no repeats while down.
#
# State lives in the workflow's own run history: a run exits nonzero when
# the ping fails, so "consecutive failures" is read back with the runs API
# (GITHUB_TOKEN only needs actions:read). The previous design stored state
# in a repository Actions variable, but writing variables fails with
# "Resource not accessible by integration" (HTTP 403) under this repo's
# token policy — see the first run on 2026-08-18.
#
# Notes:
#   * Scheduled workflows only run from the default branch — this activated
#     when the revamp merged to main (same as the keep-alive workflow).
#   * GitHub may delay or occasionally skip scheduled runs under load, so
#     timings are approximate. The alert therefore fires roughly 40-60
#     minutes into an outage.
#   * As a side effect the pings count as project activity, which also
#     protects against the free-tier inactivity pause.
#   * Failed pings show as red runs in the Actions tab by design.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  actions: read

concurrency: supabase-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ping Supabase and alert on state change
        run: |
          # The anon key is the same public key shipped in the website code.
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3cmF2bnZ5dGttc3Zxb3FrbXdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjU1MTIsImV4cCI6MjA5OTM0MTUxMn0.t4waGFmjD2hDQkGOhYg8rPt1rtf4iyRyTIC6T5KsFag"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
            "https://jwravnvytkmsvqoqkmwb.supabase.co/rest/v1/registrations?select=id&limit=1" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}" || echo "000")
          echo "Supabase responded with HTTP ${STATUS}"

          # Conclusions of the two most recent COMPLETED runs of this
          # workflow (the current run is still in_progress, so it is never
          # in this list). PREV1 is the newest. Missing runs read as empty.
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/supabase-monitor.yml/runs?status=completed&per_page=2" \
            --jq '.workflow_runs[].conclusion' 2>/dev/null || true)
          PREV1=$(echo "${RUNS}" | sed -n 1p)
          PREV2=$(echo "${RUNS}" | sed -n 2p)
          echo "Previous run conclusions: newest=${PREV1:-none}, before=${PREV2:-none}"

          send_mail() {
            curl -s "https://formsubmit.co/ajax/info@axcentdance.com" \
              -H "Content-Type: application/json" -H "Accept: application/json" \
              -d "{\"_subject\":\"$1\",\"_template\":\"table\",\"_captcha\":\"false\",\"Status\":\"$2\",\"Time\":\"$(date -u '+%Y-%m-%d %H:%M UTC')\",\"Checked\":\"Supabase REST API (registrations endpoint)\"}" \
              > /dev/null || true
          }

          if [ "${STATUS}" = "200" ]; then
            # Recovery: an alert only ever went out after two consecutive
            # failed runs, so email exactly when the last two runs failed.
            if [ "${PREV1}" = "failure" ] && [ "${PREV2}" = "failure" ]; then
              send_mail "Supabase is UP again ✅" "Recovered — portal logins, admin pages and the Stripe webhook are reachable again."
              echo "Recovery email sent."
            fi
            exit 0
          fi

          # This run will conclude "failure" (exit 1 below), encoding the
          # outage in run history. Email on the exact transition to two
          # consecutive failures: previous run failed, the one before not.
          if [ "${PREV1}" = "failure" ] && [ "${PREV2}" != "failure" ]; then
            send_mail "Supabase appears DOWN 🔴" "Two consecutive checks failed (last HTTP ${STATUS}). Portal logins and admin pages are likely unavailable. Stripe payments keep working and webhooks retry automatically — no money is lost. Check https://status.supabase.com"
            echo "Down alert sent."
          elif [ "${PREV1}" = "failure" ]; then
            echo "Still down; alert already sent earlier in this outage."
          else
            echo "First failed check; waiting for a second before alerting."
          fi
          exit 1
