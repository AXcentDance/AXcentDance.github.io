name: Quality Checks

on:
  pull_request:
  push:

jobs:
  website-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install beautifulsoup4

      - name: Run breadcrumb unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate breadcrumb schema
        run: python3 scripts/maintain_breadcrumbs.py validate

      - name: Run breadcrumb audit
        run: python3 scripts/breadcrumb_audit.py

      - name: Run site health gate
        run: python3 scripts/site_health.py

      # Rendered-truth gate: measures every responsive image in headless Chrome
      # (preinstalled on ubuntu runners) and fails if any `sizes` slot would make
      # the browser fetch a different srcset file than the rendered width needs.
      - name: Run image sizes rendered-truth gate
        run: python3 scripts/sizes_truth_checker.py

      - name: Check whitespace errors
        run: git diff --check
